<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | CinePass</title>
    <link rel="icon" type="image/png" href="./favicon.png?v=1">
    <link rel="icon" type="image/png" href="./favicon.png?v=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom Search Input Focus */
        .search-input:focus {
            background-color: #212529 !important;
            color: white !important;
            border-color: #0dcaf0 !important;
            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25) !important;
        }

        .navbar-nav .nav-link {
            transition: color 0.3s ease-in-out;
        }

        .navbar-nav .nav-link:hover {
            color: #0dcaf0 !important;
        }
    </style>
</head>

<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-lg-5 px-3 shadow-lg" id="mainNavbar">
        <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand fw-bold fs-3 transition-all" href="index.html">
                Cine<span class="text-info">Pass</span>
            </a>

            <!-- Mobile Menu Toggle Button -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links & Right-Side Actions -->
            <div class="collapse navbar-collapse" id="navbarNav">

                <!-- Main Navigation Links -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-2">
                    <li class="nav-item"><a class="nav-link active fw-medium" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" href="details.html?id=27205">Movies</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" href="details.html?id=27205#booking-section">Book
                            Tickets</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" href="theatres.html">Theatres</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" href="wishlist.html">Wishlist</a></li>
                </ul>

                <!-- Search and Profile Section -->
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 mt-3 mt-lg-0">

                    <!-- Search Bar -->
                    <!-- Search Bar -->
<form class="d-flex position-relative w-100" style="max-width: 250px;" id="searchForm">
    <input
        id="searchInput"
        class="form-control bg-dark text-white border-secondary rounded-pill ps-4 pe-5 search-input"
        type="search" placeholder="Search movies..." style="font-size: 0.9rem;" required>
    <button type="submit"
        class="btn position-absolute end-0 top-50 translate-middle-y text-secondary border-0 shadow-none px-3">
        <i class="bi bi-search"></i>
    </button>
</form>
                    <!-- Profile Button with Text -->
                    <a href="profile.html"
                        class="btn btn-outline-info rounded-pill d-flex align-items-center gap-2 px-4 py-1 transition-all">
                        <i class="bi bi-person-circle fs-5 lh-1"></i>
                        <span class="fw-medium" style="font-size: 0.95rem;" id="nav-user-name">Profile</span>
                    </a>

                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 120px;">
        <div class="row mb-5">
            <div class="col-12">
                <h2 class="fw-bold mb-0">My <span class="text-info">Wishlist</span></h2>
                <p class="text-secondary">Your curated collection of must-watch movies</p>
                <hr class="border-secondary opacity-25">
            </div>
        </div>

        <div id="wishlist-container" class="row g-4">
            <div class="col-12 text-center py-5" id="loader">
                <div class="spinner-border text-info" role="status"></div>
                <p class="mt-3 text-secondary text-uppercase tracking-widest small">Loading your favorites...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/wishlist.js"></script>
    <script>
        window.addEventListener('scroll', function () {
            const nav = document.getElementById('mainNavbar');
            if (window.scrollY > 50) {
                nav.style.background = 'rgba(5, 8, 10, 0.95)';
                nav.style.backdropFilter = 'blur(10px)';
            } else {
                nav.style.background = 'linear-gradient(to bottom, rgba(15, 23, 30, 0.9), rgba(15, 23, 30, 0))';
                nav.style.backdropFilter = 'none';
            }
        });
    </script>
</body>

</html>
