<!DOCTYPE html>

<head>

<body class="bg-dark text-white">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-lg-5 px-3 shadow-lg" style="background: rgba(5, 8, 10, 0.95); backdrop-filter: blur(10px);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3" href="index.html">
                Cine<span class="text-info">Pass</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-2">
                    <li class="nav-item"><a class="nav-link fw-medium" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" href="details.html?id=27205">Movies</a></li>

                </ul>
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3">
                    <form class="d-flex position-relative w-100" style="max-width: 250px;" id="searchForm">
                        <input id="searchInput" class="form-control bg-dark text-white border-secondary rounded-pill ps-4 pe-5" type="search" placeholder="Search movies...">
                        <button type="submit" class="btn position-absolute end-0 top-50 translate-middle-y text-secondary border-0 shadow-none px-3">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>

    <!-- Main Results Container -->
    <div class="container mt-5 pt-5 min-vh-100">
        <div class="row pt-4">
            <div class="col-12">
                <h2 class="fw-bold mb-2">Search Results</h2>
                <p class="text-secondary mb-4" id="search-status">Searching for movies...</p>
            </div>
        </div>

        <!-- Movie Grid Grid -->
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-4 g-lg-4 gy-3 mb-5" id="results-grid">
